# Netlify configuration within frontend/ directory
[build]
  publish = "."

[[redirects]]
  from = "/api/*"
  to = "https://sinceai-backend.a.run.app/api/:splat"
  status = 200
  force = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
