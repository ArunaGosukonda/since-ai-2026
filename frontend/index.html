<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Since AI — DNA Digital Security Assistant</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="brand">
      <span class="brand-badge">DNA</span>
      <div>
        <div class="brand-title">Digital Security Assistant</div>
        <div class="brand-subtitle">Hosted in Finland (europe-north1) • Multi-turn Incident Help</div>
      </div>
    </div>
    <div class="header-actions">
      <button id="reset-btn" class="btn-secondary">New Conversation</button>
    </div>
  </header>

  <main>
    <div id="chat-log"></div>
    <div class="input-container">
      <input type="text" id="chat-input" placeholder="Describe what happened (in Finnish, English, or Swedish)..." autocomplete="off" />
      <button id="send-btn" class="btn-primary">Send</button>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
