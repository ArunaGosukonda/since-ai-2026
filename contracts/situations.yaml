# Situation contracts. Generated by tools/derive_contracts.py from the dev ground truth.
# Field semantics and derivation rules are in 'derivation_rules' below and in CONFLICTS.md.
version: 1.0.0
generated_by: tools/derive_contracts.py (do not edit by hand; edit the script or family_to_situation.csv and re-run)
source: instructions/DNA_Digital_Security_Assistant_SimSet_v2.0.1/data/dev/cases.jsonl ground_truth
condition_syntax: 'when.any_of is a list of alternatives; each alternative is a list of clauses that must all hold. Clause:
  ''<fact> == v'', ''<fact> != v'', ''<fact> in [a, b]'', ''<fact> not in [a, b]''. Facts and values come from contracts/facts.schema.json;
  an absent fact is ''unknown''.'
match_order:
- S15
- S14
- S11
- S08
- S07
- S12
- S09
- S05
- S06
- S19
- S10
- S16
- S04
- S17
- S03
- S02
- S18
- S13
- S01
unknown_fact_policy: 'A fact that is absent or ''unknown'' is treated as its riskier value when it is listed in the matched
  situation''s decisive_fact: answer from the riskier situation''s row and ask that decisive_fact''s question_topic (single-turn),
  or ask it first and re-match (multi-turn). The ''when'' clauses that test ''== unknown'' are exactly those cases.'
derivation_rules:
  population: 'For each situation and audience: the dev cases whose (family, branch) maps to the situation in family_to_situation.csv,
    judged against their own branch''s ground_truth.'
  primary_action: 'The action acceptable (primary or acceptable_actions) in the most cases; ties: most cases where it is the
    reference primary, then the primary of the highest-risk cases, then the higher intervention level.'
  acceptable_actions: Actions acceptable in every mapped case, minus primary_action.
  risk_level: 'The level within one step (the scorer''s tolerance) of the most cases; ties: most exact matches, then the higher
    level.'
  urgency: 'The most common reference urgency; ties: the more urgent.'
  escalation_target: 'Handoff if most cases require one (ties: handoff). Target: the one in the most cases'' acceptable_targets;
    ties: most frequent reference target. null = no handoff.'
  required_steps: 'Steps required in at least half the cases (if none reaches half: the most frequently required step).'
  optional_steps: Steps listed (required or optional) in at least half the cases, plus, greedily, the required step that covers
    the most cases still left without one of their required steps, until every case has one in required_steps or optional_steps.
    Not already in required_steps.
  decisive_fact: 'From the single-turn population (non-twin mapped cases plus both branches of every twin family whose riskier
    branch maps here, because single-turn answers twins from the riskier row): the smallest set of must-ask topics, at most
    three, that satisfies the most cases. On a twin''s safer branch the fact is already settled, so it is not decisive there.'
  needs_consent: 'The necessary_signals set shared by the most cases; ties: the larger set.'
  guidance_refs: Refs cited in at least half the cases, then greedily the ref covering the most still-uncovered cases until
    every case shares at least one ref.
  missing_audience: When a situation has no dev cases for an audience, that audience's row is a copy of the other audience's
    row, marked derived_from_audience, with dev_families empty. If the copied escalation target is business_security_support
    (defined for small businesses only) and the row is for consumers, the target becomes the most common other target acceptable
    in the source cases.
